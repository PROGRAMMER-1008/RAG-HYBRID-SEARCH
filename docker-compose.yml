services:
  rag-api:
    build:
      context: .
      args:
        DEPENDENCY_FILE: requirements.txt
    ports:
      - "8001:8001"
    volumes:
      - ./data:/app/data
    environment:
      APP_ENV: development
      GENERATION_PROVIDER: ${GENERATION_PROVIDER:-ollama}
      JUDGE_PROVIDER: ${JUDGE_PROVIDER:-ollama}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-120b}
      OLLAMA_HOST: ${OLLAMA_HOST:-http://host.docker.internal:11434}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:8001}
      TRUSTED_HOSTS: localhost,127.0.0.1,testserver
    restart: unless-stopped
